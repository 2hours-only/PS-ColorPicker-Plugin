<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="操作示意：选择目标色，选择模式，拖动选色，松开应用">
<rect width="1200" height="260" rx="20" fill="#20232d"/><g font-family="Arial, sans-serif"><text x="36" y="44" font-size="15" fill="#aaaebf">QUICK START · 操作示意，非界面截图</text><rect x="36" y="78" width="258" height="142" rx="12" fill="#2d3140"/><text x="56" y="110" font-size="14" fill="#bcaaff">01</text><text x="56" y="150" font-size="23" fill="#f4f4fa">选择目标色</text><text x="56" y="186" font-size="16" fill="#bec2d0">前景色或背景色</text><rect x="326" y="78" width="258" height="142" rx="12" fill="#2d3140"/><text x="346" y="110" font-size="14" fill="#bcaaff">02</text><text x="346" y="150" font-size="23" fill="#f4f4fa">选择选色模式</text><text x="346" y="186" font-size="16" fill="#bec2d0">自由选色或 LUT 模式</text><rect x="616" y="78" width="258" height="142" rx="12" fill="#2d3140"/><text x="636" y="110" font-size="14" fill="#bcaaff">03</text><text x="636" y="150" font-size="23" fill="#f4f4fa">拖动选色</text><text x="636" y="186" font-size="16" fill="#bec2d0">调整色相与饱和度</text><rect x="906" y="78" width="258" height="142" rx="12" fill="#2d3140"/><text x="926" y="110" font-size="14" fill="#bcaaff">04</text><text x="926" y="150" font-size="23" fill="#f4f4fa">松开应用</text><text x="926" y="186" font-size="16" fill="#bec2d0">将颜色写入 Photoshop</text></g></svg>